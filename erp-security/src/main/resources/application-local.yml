server:
  port: 8081

spring:
  application:
    name: erp-security

  datasource:
    url: jdbc:mysql://${DB_HOST:${MYSQL_HOST:localhost}}:${DB_PORT:${MYSQL_PORT:3306}}/${DB_NAME:sme_erp_security}?useSSL=false&serverTimezone=UTC
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
    register-with-eureka: true
    fetch-registry: true
  instance:
    prefer-ip-address: true

jwt:
  # Must match HR + gateway
  secret: ${JWT_SECRET:VGhpcy1pcy1hLWxvbmctc2VjcmV0LWtleS1mb3ItZXJw}
  expiration-ms: ${JWT_EXPIRATION_MS:3600000}
