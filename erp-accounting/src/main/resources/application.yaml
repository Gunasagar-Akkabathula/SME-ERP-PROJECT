server:
  port: 8086   # changed from 8085


spring:
  application:
    name: erp-accounting   # changed from erp-sales


  # Load variables from project-root .env automatically
  # .env must be in: project root (same folder as root pom.xml)
  config:
    import: optional:file:.env[.properties]


  datasource:
    url: jdbc:mysql://localhost:3306/sme_erp_accounting?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: ${DB_ACCOUNTING_USERNAME:root}
    password: ${DB_ACCOUNTING_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver


  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect


  profiles:
    active: local


eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_SERVER_URL:http://localhost:8761/eureka/}
    register-with-eureka: true
    fetch-registry: true
  instance:
    prefer-ip-address: true


jwt:
  # Must be the SAME Base64 value as api-gateway + erp-security
  secret: ${JWT_SECRET:VGhpcy1pcy1hLWxvbmctc2VjcmV0LWtleS1mb3ItZXJw}
  expiration-ms: ${JWT_EXPIRATION_MS:3600000}


management:
  endpoints:
    web:
      exposure:
        include: health,info


logging:
  level:
    sme.erp.erp.accounting: DEBUG   # changed package
    org.springframework.web: DEBUG
    org.springframework.security: DEBUG

