server:
  port: 8083

spring:
  application:
    name: erp-hr

  # Load variables from project-root .env automatically (no VS Code manual env needed)
  # .env must be in: erp-hr/.env
  config:
    import: optional:file:.env[.properties]

  datasource:
    url: jdbc:mysql://localhost:3306/sme_erp_hr?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: ${DB_HR_USERNAME:root}
    password: ${DB_HR_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect

  profiles:
    active: local

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_SERVER_URL:http://localhost:8761/eureka/}
    register-with-eureka: true
    fetch-registry: true
  instance:
    prefer-ip-address: true

jwt:
  # Must be the SAME Base64 value as api-gateway + erp-security
  secret: ${JWT_SECRET:VGhpcy1pcy1hLWxvbmctc2VjcmV0LWtleS1mb3ItZXJw}
  expiration-ms: ${JWT_EXPIRATION_MS:3600000}

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  level:
    sme.erp.hr: DEBUG
    org.springframework.security: INFO
