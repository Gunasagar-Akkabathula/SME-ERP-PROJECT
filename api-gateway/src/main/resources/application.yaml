server:
  port: 8080

spring:
  application:
    name: api-gateway

  main:
    web-application-type: reactive

  cloud:
    gateway:
      # -----------------------------
      # GLOBAL CORS (REACT FRONTEND)
      # -----------------------------
      globalcors:
        add-to-simple-url-handler-mapping: true
        corsConfigurations:
          '[/**]':
            allowedOrigins:
              - "http://localhost:3000"
            allowedMethods:
              - GET
              - POST
              - PUT
              - PATCH     # ✅ IMPORTANT (HR lifecycle)
              - DELETE
              - OPTIONS
            allowedHeaders:
              - "*"
            allowCredentials: true

      # Avoid duplicate CORS headers
      default-filters:
        - DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials, RETAIN_UNIQUE

      routes:
        # -----------------------------
        # AUTH SERVICE (NO JWT)
        # -----------------------------
        - id: auth-service
          uri: lb://erp-security
          predicates:
            - Path=/auth/**

        # -----------------------------
        # USER SERVICE (JWT)
        # -----------------------------
        - id: user-service
          uri: lb://erp-user
          predicates:
            - Path=/user/**
          filters:
            - JwtAuthenticationFilter

        # -----------------------------
        # HR SERVICE (JWT)
        # -----------------------------
        - id: hr-service
          uri: lb://erp-hr
          predicates:
            - Path=/hr/**
          filters:
            - JwtAuthenticationFilter

        # -----------------------------
        # INVENTORY SERVICE (JWT)
        # -----------------------------
        - id: inventory-service
          uri: lb://erp-inventory
          predicates:
            - Path=/inventory/**
          filters:
            - JwtAuthenticationFilter

        # -----------------------------
        # SALES SERVICE (JWT)
        # -----------------------------
        - id: sales-service
          uri: lb://erp-sales
          predicates:
            - Path=/sales/**
          filters:
            - JwtAuthenticationFilter

        # -----------------------------
        # ACCOUNTING SERVICE (JWT)
        # -----------------------------
        - id: accounting-service
          uri: lb://erp-accounting
          predicates:
            - Path=/accounting/**
          filters:
            - JwtAuthenticationFilter

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
    register-with-eureka: true
    fetch-registry: true

  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info

# -----------------------------
# JWT CONFIG (USED BY GATEWAY)
# -----------------------------
jwt:
  # Base64 secret (same as erp-security)
  secret: ${JWT_SECRET:VGhpcy1pcy1hLWxvbmctc2VjcmV0LWtleS1mb3ItZXJw}
